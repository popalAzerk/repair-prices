<title>Tarifs de réparation — Support Apple</title>
<style>
  :root{
    --bg:#f5f5f7;
    --surface:#ffffff;
    --surface-2:#fbfbfd;
    --text:#1d1d1f;
    --text-secondary:#6e6e73;
    --accent:#0071e3;
    --accent-hover:#0077ed;
    --ac-red:#d70015;          /* AppleCare figures + plan toggle */
    --border:#d2d2d7;
    --border-soft:#e8e8ed;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 12px rgba(0,0,0,.04);
    --shadow-hover: 0 4px 16px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.06);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000; --surface:#1d1d1f; --surface-2:#161617; --text:#f5f5f7;
      --text-secondary:#98989d; --accent:#2997ff; --accent-hover:#4facff;
      --ac-red:#ff453a;
      --border:#3d3d3f; --border-soft:#2c2c2e;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 12px rgba(0,0,0,.3);
      --shadow-hover: 0 4px 20px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#000000; --surface:#1d1d1f; --surface-2:#161617; --text:#f5f5f7;
    --text-secondary:#98989d; --accent:#2997ff; --accent-hover:#4facff;
    --ac-red:#ff453a;
    --border:#3d3d3f; --border-soft:#2c2c2e;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 12px rgba(0,0,0,.3);
    --shadow-hover: 0 4px 20px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  }
  :root[data-theme="light"]{
    --bg:#f5f5f7; --surface:#ffffff; --surface-2:#fbfbfd; --text:#1d1d1f;
    --text-secondary:#6e6e73; --accent:#0071e3; --accent-hover:#0077ed;
    --ac-red:#d70015;
    --border:#d2d2d7; --border-soft:#e8e8ed;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 12px rgba(0,0,0,.04);
    --shadow-hover: 0 4px 16px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.06);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,"SF Pro Display","SF Pro Text",BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  /* ---------- Nav ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    background:color-mix(in srgb, var(--bg) 72%, transparent);
    border-bottom:1px solid var(--border-soft);
  }
  .topbar-inner{
    max-width:720px; margin:0 auto; padding:14px 22px;
    display:flex; align-items:center; gap:10px;
  }
  .apple-logo{width:15px; height:18px; flex-shrink:0; opacity:.92;}
  .topbar-title{font-size:15px; font-weight:600; letter-spacing:-0.01em; color:var(--text-primary);}

  .wrap{max-width:720px; margin:0 auto; padding:52px 24px 64px;}

  h1{
    font-size:36px; line-height:1.1; letter-spacing:-0.015em; font-weight:600;
    margin:0 0 32px; text-align:center;
  }

  /* ---------- Select boxes ---------- */
  .select-group{display:flex; flex-direction:column; gap:14px; max-width:480px; margin:0 auto;}
  .select-box{
    position:relative; border:1.5px solid var(--border); border-radius:12px;
    padding:9px 42px 9px 16px; background:var(--surface);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .select-box:hover{border-color:var(--accent);}
  .select-box:focus-within{border-color:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent);}
  .select-box label{display:block; font-size:12.5px; color:var(--text-secondary); margin-bottom:1px;}
  /* The native select is stretched invisibly over the whole box so that clicking
     anywhere - including the chevron and the label - opens it. */
  .select-box select{
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; cursor:pointer; z-index:2;
    appearance:none; -webkit-appearance:none; border:none; margin:0;
    font-family:inherit; font-size:16px;   /* >=16px stops iOS zooming on focus */
  }
  .select-box select:focus{outline:none;}
  .select-box .value{
    font-size:19px; font-weight:600; letter-spacing:-0.01em; color:var(--text);
    padding-top:2px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  }
  .select-box .chevron{
    position:absolute; right:16px; top:50%; transform:translateY(-50%);
    width:13px; height:13px; color:var(--text-secondary); pointer-events:none;
  }

  /* ---------- Content row ---------- */
  .content-row{
    display:flex; gap:48px; align-items:flex-start; justify-content:center;
    max-width:640px; margin:52px auto 0; flex-wrap:wrap;
  }
  .device-art{
    flex:0 0 130px; width:130px; height:130px; border-radius:20px;
    background:#f5f5f7; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow);
  }
  /* The inline transform (set per category in JS) crops each shot to its product. */
  .device-art img{
    width:100%; height:100%; object-fit:cover; display:block;
    transform-origin:center;
  }
  .price-panel{flex:1 1 320px; min-width:260px;}
  .panel-title{font-size:13px; color:var(--text-secondary); margin:0 0 6px;}
  .price-row{
    display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline;
    gap:0 16px; padding:15px 0; border-bottom:1px solid var(--border-soft);
  }
  .price-row:last-child{border-bottom:none;}
  .price-row .label{font-size:16px; letter-spacing:-0.005em; flex:1 1 auto;}
  .price-row .price{font-size:16px; font-weight:600; white-space:nowrap; flex:0 0 auto;}
  .price-row .price.na{color:var(--text-secondary); font-weight:400; font-size:13.5px;}
  .ac-fee{color:var(--ac-red);}
  /* Own full-width line so it never competes with the label for horizontal space. */
  .ac-note{
    flex:1 0 100%; text-align:right; margin-top:3px;
    font-size:11.5px; line-height:1.3; color:var(--ac-red);
  }

  /* ---------- AppleCare+ panel ---------- */
  .ac-panel{
    margin-top:24px; padding-top:20px; border-top:1px solid var(--border-soft);
  }
  .ac-panel-title{
    font-size:15px; font-weight:600; margin:0 0 4px; color:var(--text);
    display:flex; align-items:center; gap:6px;
  }
  .ac-panel-sub{
    font-size:12px; color:var(--text-secondary); margin:0 0 14px;
  }
  .ac-plans{display:flex; flex-direction:column; gap:0;}
  .ac-plan-row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:10px 0; border-bottom:1px solid var(--border-soft);
  }
  .ac-plan-row:last-child{border-bottom:none;}
  .ac-plan-label{font-size:14px; color:var(--text);}
  .ac-plan-price{font-size:14px; font-weight:600; color:var(--ac-red); white-space:nowrap;}
  .ac-plan-price.free{color:var(--text-secondary); font-weight:400;}

  /* ---------- AppleCare subscriptions ---------- */
  .ac-subscriptions{
    margin-top:20px; padding-top:20px; border-top:1px solid var(--border-soft);
  }
  .ac-sub-title{
    font-size:15px; font-weight:600; margin:0 0 4px; color:var(--text);
  }
  .ac-sub-sub{
    font-size:12px; color:var(--text-secondary); margin:0 0 14px;
  }
  .ac-sub-row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:10px 0; border-bottom:1px solid var(--border-soft);
  }
  .ac-sub-row:last-child{border-bottom:none;}
  .ac-sub-label{font-size:14px; color:var(--text);}
  .ac-sub-label small{color:var(--text-secondary); font-weight:400;}
  .ac-sub-price{font-size:14px; font-weight:600; color:var(--ac-red); white-space:nowrap;}
  .ac-break-even{
    font-size:12px; color:var(--text-secondary); margin-top:10px;
    background:var(--surface-2); border:1px solid var(--border-soft);
    border-radius:10px; padding:10px 12px; line-height:1.5;
  }
  .ac-break-even b{color:var(--text);}
  .ac-break-even .be-num{color:var(--ac-red); font-weight:600;}

  /* ---------- AppleCare plan toggle ---------- */
  .ac-toggle{
    display:inline-flex; gap:2px; padding:2px; margin:0 0 12px;
    background:var(--surface-2); border:1px solid var(--border-soft);
    border-radius:980px;
  }
  .ac-btn{
    border:none; background:none; font-family:inherit; font-size:11.5px; font-weight:500;
    padding:5px 13px; border-radius:980px; cursor:pointer;
    color:var(--text-secondary); white-space:nowrap;
    transition:background .15s ease, color .15s ease;
  }
  .ac-btn:hover:not(.active){color:var(--ac-red);}
  .ac-btn.active{background:var(--ac-red); color:#fff;}

  .disclaimer{
    max-width:640px; margin:28px auto 0; padding:14px 4px 0;
    font-size:12px; line-height:1.5; color:var(--text-secondary); text-align:center;
  }

  .footer{
    text-align:center; padding:32px 24px 56px;
    font-size:12px; color:var(--text-secondary); border-top:1px solid var(--border-soft);
  }

  ::selection{background:color-mix(in srgb, var(--accent) 30%, transparent);}

  /* ---------- iPad breakpoint ---------- */
  /* Image and prices stay side by side; the art shrinks and the panel is
     allowed to flex below its base width so the row never wraps. */
  @media (max-width:834px){
    .wrap{padding:44px 20px 56px;}
    .content-row{flex-wrap:nowrap; gap:32px; margin-top:44px;}
    .device-art{flex:0 0 116px; width:116px; height:116px; border-radius:18px;}
    .price-panel{flex:1 1 auto; min-width:0;}
  }

  /* ---------- iPhone breakpoint ---------- */
  @media (max-width:480px){
    .topbar-inner{padding:12px 16px;}
    .wrap{padding:32px 16px 40px;}
    h1{font-size:25px; margin-bottom:24px;}
    .select-group{gap:10px;}
    .select-box{padding:8px 38px 8px 14px;}
    .select-box label{font-size:12px;}
    .select-box .value{font-size:17px;}
    .select-box .chevron{right:14px;}
    .content-row{gap:16px; margin-top:32px;}
    .device-art{flex:0 0 84px; width:84px; height:84px; border-radius:14px;}
    .price-row{padding:11px 0; gap:10px;}
    .price-row .label{font-size:13.5px; line-height:1.3;}
    .price-row .price{font-size:13.5px;}
    .ac-note{font-size:10px; margin-top:2px;}
    .ac-btn{font-size:10.5px; padding:5px 10px;}
    .ac-toggle{margin-bottom:10px;}
    .price-row .price.na{font-size:12px;}
    .disclaimer{font-size:11.5px; margin-top:24px;}
  }

  @media (max-width:360px){
    h1{font-size:22px;}
    .select-box .value{font-size:16px;}
    .content-row{gap:12px;}
    .device-art{flex:0 0 72px; width:72px; height:72px; border-radius:12px;}
    .price-row .label{font-size:12.5px;}
    .price-row .price{font-size:12.5px;}
    .ac-note{font-size:9.5px;}
    .ac-btn{font-size:9.5px; padding:4px 8px;}
  }
</style>
</head>

function macArt(name){
  if (/neo/i.test(name))        return MAC_ART.MacBookNeo;
  if (/^\s*imac/i.test(name))   return MAC_ART.iMac;
  if (/mac\s*mini/i.test(name)) return MAC_ART.MacMini;
  if (/mac\s*studio/i.test(name)) return MAC_ART.MacStudio;
  if (/air/i.test(name))        return /15/.test(name) ? MAC_ART.MacBookAir15 : MAC_ART.MacBookAir13;
  if (/12[\s-]*inch/i.test(name)) return MAC_ART.MacBookAir13;
  if (/16|15/.test(name))       return MAC_ART.MacBookPro16;
  return MAC_ART.MacBookPro14;
}

function fmtPrice(p){
  if (typeof p !== "number") return String(p);
  return "€" + Math.round(p);
}

function sortComponents(components){
  return components
    .map((c, i) => ({ c, i }))
    .sort((a, b) => {
      const rank = x => x.c.label === "Batterie" || x.c.label === "Batterie AirPods" || x.c.label === "Batterie Boîtier" || x.c.label === "Batterie Pencil" ? 0 : (CATCHALL.has(x.c.label) ? 2 : 1);
      const ra = rank(a), rb = rank(b);
      return ra !== rb ? ra - rb : a.i - b.i;
    })
    .map(x => x.c);
}

// Category order: Mac first, then iPhone, iPad, Apple Watch, AirPods, iPod, HomePod, Apple TV
const CATEGORY_ORDER = ["Mac", "iPhone", "iPad", "AppleWatch", "AirPods", "iPod", "HomePod", "AppleTV"];
function availableCategories(){
  return CATEGORY_ORDER.filter(k => DATA[k] && DATA[k].length);
}

const AIRPODS_ORDER = ["AirPods Pro 3", "AirPods Pro 2 (Lightning & USB-C)", "AirPods Pro 1", "AirPods 4", "AirPods 3", "AirPods 1 & 2", "AirPods Max 1, USB-C & 2"];

function getSortedIndices(category){
  const arr = DATA[category] || [];
  const indices = arr.map((_, i) => i);

  if (category === "iPhone"){
    indices.reverse();
  } else if (category === "AirPods"){
    indices.sort((a, b) => AIRPODS_ORDER.indexOf(arr[a].name) - AIRPODS_ORDER.indexOf(arr[b].name));
  } else if (category === "Mac" || category === "iPad"){
    const yearOf = name => {
      const m = name.match(/(19|20)\d{2}/);
      return m ? parseInt(m[0], 10) : 9999;
    };
    indices.sort((a, b) => yearOf(arr[b].name) - yearOf(arr[a].name));
  } else if (category === "AppleWatch"){
    // Sort by series: Ultra first, then by series number descending, then SE
    const sortKey = name => {
      if (/ULTRA/i.test(name)) return [3, parseInt(name.match(/Ultra\s*(\d+)/i)?.[1] || "1")];
      if (/SE\s*3/i.test(name)) return [2, 3];
      if (/SE\s*2e/i.test(name)) return [2, 2];
      if (/\bSE\b/i.test(name) && !/SE\s*[23]/i.test(name)) return [2, 1];
      const m = name.match(/Series\s+(\d+)/i);
      return m ? [1, parseInt(m[1])] : [0, 0];
    };
    indices.sort((a, b) => {
      const [ta, sa] = sortKey(arr[a].name);
      const [tb, sb] = sortKey(arr[b].name);
      return ta !== tb ? tb - ta : sb - sa;
    });
  }

  return indices;
}

function populateModelSelect(){
  const sel = document.getElementById('model-select');
  sel.innerHTML = "";
  const arr = DATA[state.category] || [];
  const indices = getSortedIndices(state.category);

  if (state.category === 'Mac' && indices.length > 12){
    const current = [], legacy = [];
    const yearOf = name => {
      const m = name.match(/(19|20)\d{2}/);
      return m ? parseInt(m[0], 10) : 9999;
    };
    indices.forEach(i => {
      (yearOf(arr[i].name) >= 2024 ? current : legacy).push(i);
    });
    const og1 = document.createElement('optgroup');
    og1.label = 'Gamme actuelle';
    current.forEach(i => {
      const opt = document.createElement('option');
      opt.value = i; opt.textContent = arr[i].name;
      og1.appendChild(opt);
    });
    sel.appendChild(og1);
    const og2 = document.createElement('optgroup');
    og2.label = 'Modèles précédents';
    legacy.forEach(i => {
      const opt = document.createElement('option');
      opt.value = i; opt.textContent = arr[i].name;
      og2.appendChild(opt);
    });
    sel.appendChild(og2);
  } else if (state.category === 'iPhone' && indices.length > 20){
    const recent = [], older = [];
    indices.forEach(i => {
      const name = arr[i].name;
      const num = parseInt(name.match(/\d+/)?.[0]);
      const isLegacy = /^iPhone\s*(X|SE|6|7|8|11)/i.test(name);
      (isLegacy || (!isNaN(num) && num < 14) ? older : recent).push(i);
    });
    const og1 = document.createElement('optgroup');
    og1.label = 'Récents';
    recent.forEach(i => {
      const opt = document.createElement('option');
      opt.value = i; opt.textContent = arr[i].name;
      og1.appendChild(opt);
    });
    sel.appendChild(og1);
    const og2 = document.createElement('optgroup');
    og2.label = 'Modèles précédents';
    older.forEach(i => {
      const opt = document.createElement('option');
      opt.value = i; opt.textContent = arr[i].name;
      og2.appendChild(opt);
    });
    sel.appendChild(og2);
  } else if (state.category === 'AppleWatch' && indices.length > 15){
    const seriesGroups = {};
    const order = [];
    indices.forEach(i => {
      const name = arr[i].name;
      let group;
      if (/ULTRA/i.test(name)) group = 'Ultra & Hermès';
      else if (/SE/i.test(name)) group = 'SE';
      else {
        const m = name.match(/Series\s+(\d+)/i);
        group = m ? `Series ${m[1]}` : 'Autres';
      }
      if (!seriesGroups[group]) { seriesGroups[group] = []; order.push(group); }
      seriesGroups[group].push(i);
    });
    order.forEach(g => {
      const og = document.createElement('optgroup');
      og.label = g;
      seriesGroups[g].forEach(i => {
        const opt = document.createElement('option');
        opt.value = i; opt.textContent = arr[i].name;
        og.appendChild(opt);
      });
      sel.appendChild(og);
    });
  } else {
    indices.forEach(i => {
      const opt = document.createElement('option');
      opt.value = i; opt.textContent = arr[i].name;
      sel.appendChild(opt);
    });
  }
  sel.value = state.modelIndex;
}

function getAcRate(cat, name){
  const n = name.toLowerCase();
  if(cat==="iPhone"){
    if(/6s/.test(name)) return null;
    if(/SE \(2e/.test(name)) return 7.49;
    if(/SE \(3e/.test(name)) return 7.49;
    if(/7 Plus|8 Plus/.test(name)) return 10.49;
    if(/17 Pro Max|16 Pro Max|15 Pro Max|14 Pro Max|13 Pro Max|12 Pro Max|11 Pro Max|XS Max|XS|17 Pro|16 Pro|15 Pro|14 Pro|13 Pro|12 Pro|11 Pro/.test(name)) return 14.99;
    if(name==="iPhone X") return 14.99;
    if(/Air/.test(name)) return 14.99;
    if(/17e|16e/.test(name)) return 9.99;
    if(/Plus/.test(name)) return 13.49;
    if(/mini|Mini/.test(name)) return 11.99;
    if(/17|16|15|14|13|12|11|XR/.test(name)) return 11.99;
    if(/7|8/.test(name)) return 10.49;
    return null;
  }
  if(cat==="Mac"){
    if(/accessoires/i.test(name)) return null;
    if(/16/.test(n)&&/pro/.test(n)) return 16.49;
    if(/14/.test(n)&&/pro/.test(n)) return 11.49;
    if(/15/.test(n)&&/air/.test(n)) return 9.49;
    if(/13/.test(n)&&/air/.test(n)) return 8.49;
    if(/neo/.test(n)) return 5.99;
    if(/mini/.test(n)&&!/air/.test(n)) return 5.99;
    if(/studio/.test(n)) return 6.99;
    if(/imac/.test(n)) return 6.99;
    if(/pro/.test(n)) return 11.49;
    if(/air/.test(n)) return 8.49;
    return null;
  }
  if(cat==="iPad"){
    if(/Accessoires/.test(name)) return null;
    if(/Pro 13/.test(name)&&!/M4|M5/.test(name)) return null;
    if(/Pro 11/.test(name)&&!/M4|M5/.test(name)) return null;
    if(/Pro 10\.5|Pro 12\.9/.test(name)) return null;
    if(/Air 3e|Air 4e|Air 5e/.test(name)) return null;
    if(/mini 5e|mini 6e/.test(name)) return null;
    if(/^iPad (6e|7e|8e|9e|10e)/.test(name)) return null;
    if(/Pro 13/.test(name)) return 9.49;
    if(/Pro 11/.test(name)) return 8.49;
    if(/Air 13/.test(name)) return 5.99;
    if(/Air 11/.test(name)) return 4.99;
    if(/mini/.test(name)) return 4.49;
    if(/A16/.test(name)) return 4.49;
    return null;
  }
  if(cat==="AppleWatch"){
    if(/Series 3|Series 4|Series 5|Series 6|Series 7/.test(name)) return null;
    if(/Ultra|Hermès/.test(name)) return 5.49;
    if(/Acier/.test(name)) return 4.49;
    if(/SE/.test(name)) return 2.99;
    return 4.49;
  }
  if(cat==="AirPods"){ return /Max/.test(name)?2.99:1.49; }
  if(cat==="HomePod") return 0.99;
  if(cat==="AppleTV") return 0.99;
  if(cat==="iPod") return 1.49;
  return null;
}

function render(){
  const model = DATA[state.category][state.modelIndex];

  document.getElementById('cat-value').textContent = CATEGORY_LABELS[state.category] || state.category;
  document.getElementById('model-value').textContent = model.name;

  const art = state.category === 'Mac' ? macArt(model.name) : DEVICE_ART[state.category];
  const tile = document.getElementById('device-art');
  tile.style.background = art && art.bg ? art.bg : "";
  tile.innerHTML = art
    ? `<img src="${AI}${art.slug}?wid=600&hei=600&fmt=jpeg&qlt=90"
            alt="${model.name.replace(/"/g,'&quot;')}" loading="lazy"
            style="${art.clip ? `clip-path:inset(${art.clip});` : ""} transform:scale(${art.zoom}) translate(${art.tx}%, ${art.ty}%)">`
    : "";

  const list = document.getElementById('price-list');
  list.innerHTML = "";
  const acRate = getAcRate(state.category, model.name);
  sortComponents(model.components).forEach(c => {
    const row = document.createElement('div');
    row.className = 'price-row';
    const isNum = typeof c.price === 'number';
    const label = FR_LABELS[c.label] || c.label;
    const fee = (typeof c.acFee === 'number')
      ? `<span class="ac-fee"> / €${c.acFee}</span>` : "";
    
    // Break-even per component
    let be = '';
    if (acRate && isNum && typeof c.acFee === 'number' && c.price > c.acFee) {
      const savings = c.price - c.acFee;
      const monthsAC = Math.ceil(savings / acRate);
      const monthsOne = Math.ceil(savings / 20.99);
      be = `<div class="ac-note">≈ ${monthsAC} mois AC+ (${monthsOne} mois AC One) pour égaler ${c.price}€</div>`;
    }
    
    row.innerHTML = `<div class="label">${label}</div>
      <div class="price${isNum ? '' : ' na'}">${fmtPrice(c.price)}${fee}</div>${be}`;
    list.appendChild(row);
  });

  // AppleCare+ panel
  const acPanel = document.getElementById('ac-panel');
  const acPlans = AC_PLUS[state.category];
  const acRate = getAcRate(state.category, model.name);
  let acHtml = '';
  
  // Subscriptions (AppleCare+ monthly + AppleCare One)
  if (acRate) {
    acHtml += '<div class="ac-subscriptions">';
    acHtml += '<div class="ac-sub-title">Abonnement</div>';
    acHtml += '<div class="ac-sub-sub">Prix mensuel — résiliable à tout moment</div>';
    acHtml += `<div class="ac-sub-row"><div class="ac-sub-label">AppleCare+ <small>${state.category === 'iPhone' || state.category === 'iPad' || state.category === 'AppleWatch' ? 'avec vol et perte' : ''}</small></div><div class="ac-sub-price">${acRate.toString().replace('.', ',')}€/mois</div></div>`;
    acHtml += `<div class="ac-sub-row"><div class="ac-sub-label">AppleCare One <small>(jusqu'à 3 appareils, +5,99€/appareil suppl.)</small></div><div class="ac-sub-price">20,99€/mois</div></div>`;
    acHtml += '</div>';
  }
  
  // Franchises panel
  if (acPlans && acPlans.length) {
    acHtml += '<div class="ac-panel">';
    acHtml += '<div class="ac-panel-title">AppleCare+ — Franchises</div>';
    acHtml += '<div class="ac-panel-sub">Franchise par incident — appareil couvert</div>';
    acHtml += '<div class="ac-plans">';
    acPlans.forEach(p => {
      const priceStr = p.price === 0 ? 'Gratuit' : '€' + p.price;
      const freeClass = p.price === 0 ? ' free' : '';
      acHtml += `<div class="ac-plan-row"><div class="ac-plan-label">${p.label}</div><div class="ac-plan-price${freeClass}">${priceStr}</div></div>`;
    });
    acHtml += '</div></div>';
  }
  acPanel.innerHTML = acHtml;
}

document.getElementById('cat-select').addEventListener('change', e => {
  state.category = e.target.value;
  state.modelIndex = getSortedIndices(state.category)[0];
  populateModelSelect();
  render();
});
document.getElementById('model-select').addEventListener('change', e => {
  state.modelIndex = parseInt(e.target.value, 10);
  render();
});
state.category = availableCategories()[0];
state.modelIndex = getSortedIndices(state.category)[0];
populateCategorySelect();
populateModelSelect();
render();

</script>
</body>
</html>
